# Runtime DB boundary. 메인 서비스(backend)와 같은 계정·스키마를 쓴다 (DB 공유 1단계, docs/database-boundaries.md).
# Test slices do not call main(), so they keep their own test database configuration.
spring:
  datasource:
    username: application_user
    password: ${APPLICATION_DB_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO application, pg_catalog
  jpa:
    hibernate:
      # 테이블마다 엔티티를 가진 서비스(소유 서비스)가 update로 관리한다. 소유 표는 docs/database-boundaries.md.
      # application_user owns only the application schema, so update cannot touch other schemas.
      ddl-auto: update
    properties:
      hibernate:
        default_schema: application
