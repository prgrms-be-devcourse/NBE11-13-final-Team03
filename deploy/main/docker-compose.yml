# 메인 서버(EC2)용 compose: backend + 알림 서버(notification-service). 컨테이너만 나눠 같은 서버에서 돈다.
# GitHub Actions(.github/workflows/deploy.yml)가 배포 때마다 메인 서버의 배포 폴더로 복사한다.
#
# 배포 폴더에 필요한 파일
#   .env              backend 환경변수 (deploy/main/.env.example 참고, 직접 만든다. git에 올리지 않는다)
#   notification.env  알림 서버 환경변수 (deploy/main/notification.env.example 참고, 직접 만든다. git에 올리지 않는다)
#   deploy.env        BACKEND_IMAGE·NOTIFICATION_IMAGE=<GHCR 이미지> (Actions가 서비스별로 한 줄씩 쓴다)
#
# 실행: docker compose -f docker-compose.yml --env-file .env --env-file deploy.env up -d <backend|notification-service>
# 서비스끼리 의존(depends_on)을 두지 않는다: 한쪽 배포가 다른 쪽을 재시작하지 않게.
name: yon-main

services:
  backend:
    image: ${BACKEND_IMAGE:-backend-not-deployed}
    env_file: .env
    environment:
      # 알림 서버와 한 서버(2GB)를 나눠 쓴다 (backend 50% + 알림 25%, 나머지는 JVM 비힙·OS. 스왑 필수)
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=50.0}
      # 수집·정규화는 데이터 서버가 한다. backend에 같은 코드가 남아 있는 동안에도 두 곳에서 돌지 않게 끈다
      COLLECTION_SCHEDULE_ENABLED: "false"
      YON_NORMALIZATION_INGEST_ENABLED: "false"
      YON_NORMALIZATION_CONDITION_SET_BACKFILL_ENABLED: "false"
      REGION_CODE_SYNC_ON_STARTUP: "false"
      # 같은 compose 네트워크의 알림 서버. 실제 호출 여부는 .env의 NOTIFICATION_PUBLISHER_ENABLED·NOTIFICATION_FACADE_ENABLED가 정한다
      NOTIFICATION_BASE_URL: http://notification-service:8081
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  notification-service:
    image: ${NOTIFICATION_IMAGE:-notification-service-not-deployed}
    # backend의 .env(application_user 비밀번호 등)를 받지 않도록 파일을 나눈다.
    # 없어도 backend 배포가 깨지지 않게 required: false (알림 서버는 DB 비밀번호가 없으면 기동 확인에서 실패한다)
    env_file:
      - path: notification.env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: ${NOTIFICATION_JAVA_OPTS:--XX:MaxRAMPercentage=25.0}
      PORT: "8081"
      TZ: Asia/Seoul
    # 호스트에 공개하지 않는다. backend만 compose 네트워크 안에서 http://notification-service:8081로 부른다
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
