# 메인 서버(EC2)용 compose. GitHub Actions(.github/workflows/deploy.yml)가 배포 때마다 메인 서버의 배포 폴더로 복사한다.
# 지금은 backend만. 알림 서버(notification-service)는 이 서버에 함께 올릴 예정이다 (담당자가 서비스 추가).
#
# 배포 폴더에 필요한 파일
#   .env        운영 환경변수 (deploy/main/.env.example 참고, 직접 만든다. git에 올리지 않는다)
#   deploy.env  BACKEND_IMAGE=<GHCR 이미지> (Actions가 쓴다)
#
# 실행: docker compose -f docker-compose.yml --env-file .env --env-file deploy.env up -d backend
name: yon-main

services:
  backend:
    image: ${BACKEND_IMAGE:-backend-not-deployed}
    env_file: .env
    environment:
      # 알림 서버도 이 서버(2GB)에 올라오므로 절반만 쓴다
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=50.0}
      # 수집·정규화는 데이터 서버가 한다. backend에 같은 코드가 남아 있는 동안에도 두 곳에서 돌지 않게 끈다
      COLLECTION_SCHEDULE_ENABLED: "false"
      YON_NORMALIZATION_INGEST_ENABLED: "false"
      YON_NORMALIZATION_CONDITION_SET_BACKFILL_ENABLED: "false"
      REGION_CODE_SYNC_ON_STARTUP: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
