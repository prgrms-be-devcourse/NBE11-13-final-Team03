# Single entry point for the browser. Services are resolved at request time through Docker DNS,
# so nginx can start before (or survive restarts of) the service containers.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    set $backend http://backend:8080;

    # Notification user APIs: route directly only if the team chooses direct routing over the
    # Application facade. Until then every /api request goes to backend.
    # location /api/notifications/ {
    #     set $notification http://notification-service:8081;
    #     proxy_pass $notification;
    #     (copy the proxy_set_header lines from "location /" below)
    # }

    # Service-to-service APIs must never be exposed through nginx.
    location /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass $backend;
        # $http_host keeps the browser's host:port, so OAuth redirect URIs stay correct on non-80 ports.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
