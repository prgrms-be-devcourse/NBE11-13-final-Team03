plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.6'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.team3'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.3")
}


sourceSets.main.proto.srcDir '../contracts/proto'

// Match PR A and the Spring Boot 4.1.1 managed runtime versions.
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.35.1' }
    plugins { grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.83.1' } }
    generateProtoTasks { all().configureEach { plugins { grpc {} } } }
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.57.2')
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-client'

    // 알림 서비스 연동(#39)이 사용하는 OpenFeign은 유지한다.
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // PATCH support for NotificationUserClient only (its child-context Client bean).
    implementation 'io.github.openfeign:feign-java11'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    // 공식 원문 HTML → 텍스트 (정규화 근거 추출)
    implementation 'org.jsoup:jsoup:1.21.1'
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    //env
    developmentOnly 'me.paulschwarz:springboot4-dotenv:5.1.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    compileOnly 'org.projectlombok:lombok'
    implementation 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    testImplementation 'com.github.database-rider:rider-junit5:1.44.0:jakarta'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    def group = providers.gradleProperty('testGroup').orElse('all').get()
    useJUnitPlatform {
        if (group == 'postgres') { includeTags 'postgres'; excludeTags 'manual' }
        else if (group == 'fast') { excludeTags 'postgres', 'manual' }
        else if (group == 'manual') { includeTags 'manual' }
        else if (group != 'all') { throw new GradleException("Unknown testGroup: ${group}") }
    }
    if (group != 'all') {
        reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/${group}")
        reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/${group}")
    }
    // Gradle 테스트 JVM 기본 힙(512m)으로는 Spring 테스트 컨텍스트 캐시(기본 32개)가 쌓이면 OutOfMemoryError가 난다.
    // CI 러너(16GB)에 맞춰 힙만 늘린다. 캐시 크기는 줄이지 않는다: 컨텍스트가 캐시에서 밀려 닫히면
    // ddl-auto:create-drop이 같은 이름의 공유 H2 메모리 DB(jdbc:h2:mem:yon) 테이블을 지워 다른 컨텍스트 테스트가 깨진다.
    maxHeapSize = '4g'
}

// Administrator SQL is test input, never an application startup resource.
tasks.named('processTestResources') {
    from('../database/scripts') {
        into 'db-boundary'
    }
    from('../contracts') {
        into 'contracts'
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

// Real primary/standby lifecycle is opt-in; ordinary tests keep their existing scope.
sourceSets {
    replicaTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}
configurations {
    replicaTestImplementation.extendsFrom testImplementation
    replicaTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    replicaTestImplementation 'com.github.database-rider:rider-junit5:1.44.0:jakarta'
}
tasks.named('processReplicaTestResources') {
    from('../database/scripts/database-boundaries.sql') { into 'replica' }
}
tasks.register('replicaTest', Test) {
    description = 'Actual PostgreSQL streaming replication and application routing'
    group = 'verification'
    testClassesDirs = sourceSets.replicaTest.output.classesDirs
    classpath = sourceSets.replicaTest.runtimeClasspath
    useJUnitPlatform()
    maxHeapSize = '1g'
}
