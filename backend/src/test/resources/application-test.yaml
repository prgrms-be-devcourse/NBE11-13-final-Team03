spring:
  datasource:
    url: jdbc:h2:mem:yon;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # create (not create-drop): every test context shares the same in-memory H2 (jdbc:h2:mem:yon, DB_CLOSE_DELAY=-1).
      # When the Spring test context cache (max 32) evicts a context, create-drop dropped the shared tables and
      # broke the contexts still cached (Table "USERS" not found). create rebuilds the schema when a context starts
      # and never drops it on close. Tests still clean their own data.
      ddl-auto: create
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  issuer: yon-test
  secret-key: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==
  access-token-validity: 2h
  refresh-token-validity: 7d

internal:
  api-key: test-internal-api-key


app:
  kakao-unlink:
    enabled: false
  admin-kakao-ids: ""
  auth-cookie:
    secure: false
    same-site: Lax
    path: /
yon:
  data-service:
    internal-api-key: test-data-service-internal-api-key
  normalization:
    ingest:
      enabled: false
