spring:
  application:
    name: backend
  config:
    import:
      - optional:classpath:youth-policy-codes.yaml

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.type.json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper

  cloud:
    openfeign:
      client:
        config:
          data-service:
            connect-timeout: 3000
            read-timeout: 10000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yon}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: yon-scheduling-

app:
  admin-kakao-ids: ${ADMIN_KAKAO_IDS:}

  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    path: /

  auth-session:
    max-active-sessions: 3
    device-cookie-validity: 365d

jwt:
  issuer: yon
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: 30m
  refresh-token-validity: 7d

internal:
  api-key: ${INTERNAL_API_KEY}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-no-trace}] %logger{36} - %msg%n"

yon:
  eligibility:
    # 판정 결과 제공 방식. local: 같은 애플리케이션 안에서 직접 호출 (MSA 전환 시 원격 구현을 추가하고 값을 바꾼다)
    provider: ${YON_ELIGIBILITY_PROVIDER:local}
  # 수집·정규화 서비스. 수집 관리자 API(/api/admin/collection/**)를 내부 API로 전달한다
  data-service:
    base-url: ${DATA_SERVICE_BASE_URL:http://localhost:8082}
