spring:
  application:
    name: backend
  config:
    import:
      - optional:classpath:youth-policy-codes.yaml

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.type.json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
      hibernate.hbm2ddl.extra_physical_table_types: PARTITIONED TABLE

  grpc:
    client:
      channel:
        data-service:
          target: ${DATA_SERVICE_GRPC_ADDRESS:static://localhost:9092}
          ssl:
            enabled: false
          inbound:
            message:
              max-size: 16MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yon}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: yon-scheduling-

app:
  admin-kakao-ids: ${ADMIN_KAKAO_IDS:}

  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    path: /

  auth-session:
    max-active-sessions: 3
    device-cookie-validity: 365d

jwt:
  issuer: yon
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: 30m
  refresh-token-validity: 7d

internal:
  api-key: ${INTERNAL_API_KEY}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-no-trace}] %logger{36} - %msg%n"

yon:
  # DB 읽기 복제본. DB_REPLICA_URL 환경변수가 있을 때만 켜진다 (ReadReplicaDataSourceConfig). 없으면 primary 하나만 쓴다.
  # 읽기 전용 트랜잭션 중 transaction-prefixes(클래스.메서드 전체 이름 접두사)에 맞는 조회만 복제본으로 보낸다.
  # 비워 두면 검색·상세·추천(OpportunitySearchService, OpportunityDetailService, RecommendationService).
  datasource:
    replica:
      # 복제본 연결을 이 시간 안에 못 얻으면 primary로 대신 연결한다
      connection-timeout-ms: 2000
      # 복제본 연결에 실패하면 이 시간 동안은 복제본을 건너뛰고 바로 primary를 쓴다 (장애 중 요청마다 대기 시간이 붙지 않게)
      failure-cooldown-ms: 30000
      transaction-prefixes:
  behavior:
    # 행동 로그 월 파티션 보관 정리 (UserBehaviorEventRetentionScheduler, 매월 1일 03:00 KST).
    # 운영 DB의 파티션 전환·점검과 _old 삭제를 확인한 환경에서만 켠다. dry-run=true면 대상만 로그로 남긴다.
    retention:
      enabled: ${YON_BEHAVIOR_RETENTION_ENABLED:false}
      # 현재 월을 포함해 보관하는 월 수 (4: 현재 월 + 직전 3개월)
      retained-months: ${YON_BEHAVIOR_RETENTION_RETAINED_MONTHS:4}
      dry-run: ${YON_BEHAVIOR_RETENTION_DRY_RUN:true}
      # 운영자 수동 정리 (UserBehaviorEventRetentionManualRun). 웹 서버 없는 일회성 실행에서만 동작하며 기본은 dry-run.
      # 실행 방법은 docs/user-behavior-events-partitioning.md 7절. .env에 상시로 두지 않는다
      manual-run: ${YON_BEHAVIOR_RETENTION_MANUAL_RUN:false}
      manual-execute: ${YON_BEHAVIOR_RETENTION_MANUAL_EXECUTE:false}
      # 관리자 API(POST /api/admin/behavior-events/retention/execute)의 실제 정리 허용. 미리보기는 항상 읽기 전용으로 동작한다.
      # 자동 정리(enabled)·수동 실행과 별개이며, 운영 파티션 확인·백업 확인 전에는 켜지 않는다 (문서 8절)
      admin-execute-enabled: ${YON_BEHAVIOR_RETENTION_ADMIN_EXECUTE_ENABLED:false}
  eligibility:
    # 판정 결과 제공 방식. local: 같은 애플리케이션 안에서 직접 호출 (MSA 전환 시 원격 구현을 추가하고 값을 바꾼다)
    provider: ${YON_ELIGIBILITY_PROVIDER:local}
  # 수집·정규화 서비스. 수집 관리자 API(/api/admin/collection/**)를 내부 API로 전달한다
  data-service:
    # DataService 전용 내부 키. data-service의 DATA_SERVICE_INTERNAL_API_KEY와 같은 값
    internal-api-key: ${DATA_SERVICE_INTERNAL_API_KEY}
