spring:
  application:
    name: backend
    
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/yon}
      driver-class-name: org.postgresql.Driver
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:1234}
  
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email

      provider:
        kakao:
          authorization-uri: https://kauth.kakao.com/oauth/authorize
          token-uri: https://kauth.kakao.com/oauth/token
          user-info-uri: https://kapi.kakao.com/v2/user/me
          user-name-attribute: id

  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: yon-scheduling-
  
  app:
    admin-kakao-ids: ${ADMIN_KAKAO_IDS:}
  
    auth-cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: /
  
    auth-session:
      max-active-sessions: 3
      device-cookie-validity: 365d
  
  jwt:
    issuer: yon
    secret-key: ${JWT_SECRET_KEY}
    access-token-validity: 30m
    refresh-token-validity: 7d
  
  internal:
    api-key: ${INTERNAL_API_KEY}
  
  logging:
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-no-trace}] %logger{36} - %msg%n"

 collection:
  employment24:
    url: https://www.work24.go.kr/cm/openApi/call/hr/callOpenApiSvcInfo310L01.do
    api-key: ${EMPLOYMENT24_API_KEY:}
    connect-timeout: 5s
    read-timeout: 20s
  youth-policy:
    url: https://www.youthcenter.go.kr/go/ythip/getPlcy
    api-key: ${YOUTH_POLICY_API_KEY:}
    connect-timeout: 5s
    read-timeout: 20s
