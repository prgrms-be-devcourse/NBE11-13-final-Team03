# Runtime DB boundary. Existing test slices keep their own test database configuration.
spring:
  datasource:
    username: application_user
    password: ${APPLICATION_DB_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO application, pg_catalog
  jpa:
    hibernate:
      # Until a migration tool is adopted, Hibernate keeps managing the application schema.
      # application_user owns only the application schema, so update cannot touch other schemas.
      ddl-auto: update
    properties:
      hibernate:
        default_schema: application
