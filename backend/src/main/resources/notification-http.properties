# Explicit aliases also work with developmentOnly dotenv; secrets have no usable default.
yon.notification.publisher.enabled=${NOTIFICATION_PUBLISHER_ENABLED:false}
yon.notification.publisher.transport=${NOTIFICATION_PUBLISHER_TRANSPORT:http}
yon.notification.sqs.queue-url=${NOTIFICATION_SQS_QUEUE_URL:}
yon.notification.sqs.region=${NOTIFICATION_SQS_REGION:}
yon.notification.sqs.endpoint=${NOTIFICATION_SQS_ENDPOINT:}
yon.notification.publisher.base-url=${NOTIFICATION_BASE_URL:http://notification-base-url-not-configured.invalid}
yon.notification.publisher.api-key=${NOTIFICATION_INTERNAL_API_KEY:}
yon.notification.facade.enabled=${NOTIFICATION_FACADE_ENABLED:false}
yon.notification.facade.base-url=${NOTIFICATION_BASE_URL:http://notification-base-url-not-configured.invalid}
yon.notification.facade.api-key=${NOTIFICATION_INTERNAL_API_KEY:}
