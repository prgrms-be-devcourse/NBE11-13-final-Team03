name: Collection PostgreSQL tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test_report.py'
      - 'scripts/test-policy.json'
      - 'scripts/test_report_test.py'
      - 'contracts/proto/**'
      - 'backend/**'
      - 'database/**'
      - 'contracts/**'
      - '.github/workflows/collection-postgres-tests.yml'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: yon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Require Docker
        run: docker info
      - name: Run all backend tests
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean test --rerun --no-daemon --console=plain
        env:
          YON_TEST_DB_URL: jdbc:postgresql://localhost:5432/yon_test
          YON_TEST_DB_USERNAME: postgres
          YON_TEST_DB_PASSWORD: test
      # NOTIFY 트리거 테스트는 수집·정규화와 함께 data-service로 옮겨 data-service.yml에서 확인한다
      - name: Validate and report execution groups
        if: always()
        run: python3 scripts/test_report.py backend --output backend/build/test-summary
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
            backend/build/reports/jacoco
            backend/build/test-summary
