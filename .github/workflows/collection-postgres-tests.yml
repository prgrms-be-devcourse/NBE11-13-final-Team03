name: Collection PostgreSQL tests

on:
  pull_request:
    branches: [main, codex/collection-grpc-server]
    paths:
      - 'contracts/proto/**'
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/collection-postgres-tests.yml'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: yon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Require Docker
        run: docker info
      - name: Run all backend tests
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon --console=plain
        env:
          YON_TEST_DB_URL: jdbc:postgresql://localhost:5432/yon_test
          YON_TEST_DB_USERNAME: postgres
          YON_TEST_DB_PASSWORD: test
      - name: Require executed PostgreSQL notification tests
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path('backend/build/test-results/test/TEST-com.team3.backend.collection.service.NormalizationNotificationTriggerTests.xml')
          suite = ET.parse(report).getroot()
          assert int(suite.attrib['tests']) > 0, 'Notification tests did not run'
          for key in ('skipped', 'failures', 'errors'):
              assert int(suite.attrib[key]) == 0, f'Notification tests: {key}={suite.attrib[key]}'
          print(f"PostgreSQL notification tests passed: {suite.attrib['tests']}")
          suites = [ET.parse(path).getroot() for path in pathlib.Path('backend/build/test-results/test').glob('TEST-*.xml')]
          counts = {key: sum(int(result.attrib.get(key, 0)) for result in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          print(f"Backend test totals: {counts}")
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
