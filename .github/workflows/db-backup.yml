name: DB backup verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/db-replica/**'
      - 'deploy/tests/*db_backup*'
      - '.github/workflows/db-backup.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/db-replica/**'
      - 'deploy/tests/*db_backup*'
      - '.github/workflows/db-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit checks and timer syntax
        run: |
          python3 -m unittest discover -s deploy/tests -p test_db_backup.py -v
          systemd-analyze calendar '*-*-* 11:00:00 Asia/Seoul'
      - name: Require local test dependencies
        run: |
          docker info
          docker compose version
      - name: PostgreSQL 16 streaming replica local backup and restore
        run: python3 deploy/tests/check_db_backup_postgres.py
