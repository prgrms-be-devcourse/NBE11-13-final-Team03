name: Notification service

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test_report.py'
      - 'scripts/test-policy.json'
      - 'scripts/test_report_test.py'
      - 'notification-service/**'
      - 'database/**'
      - 'contracts/**'
      - '.github/workflows/notification-service.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/test_report.py'
      - 'scripts/test-policy.json'
      - 'scripts/test_report_test.py'
      - 'notification-service/**'
      - '.github/workflows/notification-service.yml'
      - 'contracts/**'
      - 'database/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            notification-service/*.gradle
            notification-service/gradle/wrapper/gradle-wrapper.properties
      - name: Require Docker for PostgreSQL boundary tests
        run: docker info
      - name: Test and build Notification independently
        working-directory: notification-service
        run: bash ./gradlew --no-daemon clean test --rerun bootJar
      - name: Validate and report execution groups
        if: always()
        run: python3 scripts/test_report.py notification-service --output notification-service/build/test-summary
      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-jar
          path: notification-service/build/libs/notification-service.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-test-reports
          path: |
            notification-service/build/reports/tests/test
            notification-service/build/test-results/test
            notification-service/build/reports/jacoco
            notification-service/build/test-summary

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PLATFORM: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: notification-service-jar
          path: notification-service/build/libs
      - name: Set up QEMU
        if: env.IMAGE_PLATFORM != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish Notification image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/notification-service"
          docker buildx build notification-service \
            --platform "$IMAGE_PLATFORM" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --metadata-file notification-image-metadata.json \
            --push
          DIGEST=$(jq -er '."containerimage.digest"' notification-image-metadata.json)
          printf 'Commit: `%s`\n\nImage: `%s:sha-%s`\n\nDeploy: `%s@%s`\n' \
            "$GITHUB_SHA" "$IMAGE" "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
