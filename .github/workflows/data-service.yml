name: Data service

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test_report.py'
      - 'scripts/test-policy.json'
      - 'scripts/test_report_test.py'
      - 'contracts/**'
      - 'data-service/**'
      - 'deploy/tests/**'
      - '.github/workflows/deploy.yml'
      - 'database/**'
      - '.github/workflows/data-service.yml'
  # main에 반영되면 이미지를 GHCR에 올린다 → deploy.yml이 EC2에 배포한다
  push:
    branches: [main]
    paths:
      - 'scripts/test_report.py'
      - 'scripts/test-policy.json'
      - 'scripts/test_report_test.py'
      - 'contracts/**'
      - 'data-service/**'
      - 'deploy/tests/**'
      - '.github/workflows/deploy.yml'
      - 'database/**'
      - '.github/workflows/data-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            data-service/*.gradle
            data-service/gradle/wrapper/gradle-wrapper.properties
      - name: Check deployment readiness and rollback
        run: python3 deploy/tests/test_grpc_readiness.py
      # 정규화 요청 NOTIFY 트리거 테스트(Testcontainers PostgreSQL)가 Docker를 쓴다
      - name: Require Docker
        run: docker info
      - name: Test and build data-service independently
        working-directory: data-service
        run: bash ./gradlew --no-daemon clean test --rerun bootJar
      - name: Validate and report execution groups
        if: always()
        run: python3 scripts/test_report.py data-service --output data-service/build/test-summary
      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: data-service-jar
          path: data-service/build/libs/app.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-service-test-reports
          path: |
            data-service/build/reports/tests/test
            data-service/build/test-results/test
            data-service/build/test-summary

  # notification-service.yml과 같은 방식: 검증에서 만든 JAR로 이미지를 만들어 ghcr.io/<저장소>/data-service:sha-<커밋>으로 올린다
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PLATFORM: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: data-service-jar
          path: data-service/build/libs
      - name: Set up QEMU
        if: env.IMAGE_PLATFORM != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish data-service image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/data-service"
          docker buildx build data-service \
            --platform "$IMAGE_PLATFORM" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --metadata-file data-service-image-metadata.json \
            --push
          DIGEST=$(jq -er '."containerimage.digest"' data-service-image-metadata.json)
          printf 'Commit: `%s`\n\nImage: `%s:sha-%s`\n\nDeploy: `%s@%s`\n' \
            "$GITHUB_SHA" "$IMAGE" "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
