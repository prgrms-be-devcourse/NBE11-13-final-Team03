name: Service E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test_report.py'
      - 'scripts/test-policy.json'
      - 'scripts/test_report_test.py'
      - 'backend/**'
      - 'data-service/**'
      - 'notification-service/**'
      - 'database/**'
      - 'deploy/**'
      - '.github/workflows/backend-image.yml'
      - '.github/workflows/data-service.yml'
      - '.github/workflows/notification-service.yml'
      - 'contracts/**'
      - 'scripts/notification-sqs-e2e/**'
      - '.github/workflows/service-e2e.yml'
  schedule:
    - cron: '0 17 * * 1' # Tuesday 02:00 KST; hosted Docker, independent of EC2 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            data-service/*.gradle
            notification-service/*.gradle
            **/gradle/wrapper/gradle-wrapper.properties
      - name: Require Docker
        run: docker info
      - name: Run real JAR service flows
        run: python3 scripts/notification-sqs-e2e/run.py --output .validation/service-e2e
      - name: Validate and report required scenarios
        if: always()
        run: python3 scripts/test_report.py service-e2e --results .validation/service-e2e/results.json --output .validation/service-e2e/summary
      - name: Upload results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-e2e-evidence
          path: .validation/service-e2e/
          include-hidden-files: true
          if-no-files-found: error
