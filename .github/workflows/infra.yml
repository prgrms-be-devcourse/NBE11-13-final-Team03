name: Infrastructure validation

on:
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml', 'deploy/README.md']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml', 'deploy/README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test inventory collector and import plan guard
        run: python3 -m unittest discover -s infra/tests -v
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.0'
          terraform_wrapper: false
      - name: Validate network configuration without AWS credentials
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -input=false -lockfile=readonly
          terraform validate
          # Mock provider and explicit imported values; no real AWS plan/apply.
          terraform test -no-color
