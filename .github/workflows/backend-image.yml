name: Publish backend image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_PLATFORM: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: yon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Require Docker for PostgreSQL tests
        run: docker info

      - name: Test backend
        working-directory: backend
        run: bash ./gradlew --no-daemon clean test --rerun
        env:
          YON_TEST_DB_URL: jdbc:postgresql://localhost:5432/yon_test
          YON_TEST_DB_USERNAME: postgres
          YON_TEST_DB_PASSWORD: test

      - name: Build executable JAR on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: backend
        run: bash ./gradlew --no-daemon bootJar

      - name: Validate and report execution groups
        if: always()
        run: python3 scripts/test_report.py backend --output backend/build/test-summary

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
            backend/build/reports/jacoco
            backend/build/test-summary

      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.IMAGE_PLATFORM != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build image and publish on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/backend"
          docker buildx build backend \
            --platform "$IMAGE_PLATFORM" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --metadata-file image-metadata.json \
            --push
          DIGEST=$(jq -er '."containerimage.digest"' image-metadata.json)
          printf 'Commit: `%s`\n\nImage: `%s:sha-%s`\n\nDeploy: `%s@%s`\n' \
            "$GITHUB_SHA" "$IMAGE" "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker logout ghcr.io
